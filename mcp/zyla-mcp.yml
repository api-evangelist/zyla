tools:
- name: search_catalog
  description: 'Use this FIRST whenever the user needs live, real-world or external data you do not have:
    train or flight status, weather, prices, stocks, currency rates, company or person lookups, social
    media data, validation, scraping and more. Semantic search across ALL 10,000+ public APIs on Zyla
    API Hub. Natural-language queries work best (e.g. "trains departing from a station now", "validate
    an email address", "get stock prices"). Returns matching APIs ranked by relevance with their ID, name,
    description, category, price per successful call (USD), average latency (ms), and endpoints summary.'
- name: get_api_info
  description: Get full details of a specific Zyla API by its numeric ID. Returns the API name, description,
    category, price per successful call (USD), average latency (ms), and all endpoints with their parameters,
    example values, and a formal JSON Schema (input_schema) for argument validation.
- name: call_api
  description: 'Call an API endpoint on Zyla API Hub. Requires the user''s API key and a credit card on
    file. Billing is pay-per-successful-request: you only pay for 2xx responses. Each API has its own
    price per call (shown in get_api_info), and every successful response includes cost_usd — the exact
    amount billed for that call. There is no monthly fee and no minimums. Usage is charged to the credit
    card automatically; call account_status for the billing mode in effect and the amount accrued this
    cycle. If a 402 error is returned with a payment_url, the user MUST open that URL in their browser
    to add a credit card before retrying. Pass the api_id, endpoint_id, HTTP method, and parameters.'
- name: browse_catalog
  description: Browse the full Zyla API Hub catalog with pagination. Use this to explore ALL public APIs
    beyond the top 500. Supports filtering by category and search keyword. Returns paginated results with
    total count and page info.
- name: list_categories
  description: 'List all available API categories on Zyla API Hub with the real count of public APIs in
    each. Use the category names returned here as the "category" parameter in browse_catalog to filter
    APIs by category. Example categories: Sports, Finance, Data, Science, etc.'
- name: register
  description: 'Register a new Zyla API Hub account directly from the AI agent. Returns an API key AND
    a payment_url. The user MUST open the payment_url in their browser to add a credit card before making
    any API calls. Billing model: pay-per-successful-request with no monthly fee and no minimums. Each
    API has its own per-call price. The card is only ever charged for actual usage; call account_status
    to see the billing mode in effect and the amount accrued this cycle. No authentication required to
    call this tool.'
- name: account_status
  description: Check the current user's account status, billing, and usage. Returns plan info, API call
    count, the amount consumed this billing cycle in USD (amount_consumed_this_cycle_usd), the billing
    mode in effect (billing_mode), whether a credit card is on file, and any failed/pending payments.
    Use this to diagnose why API calls are blocked (missing card or failed payment). Requires the user's
    API key in the Authorization header.
- name: get_payment_url
  description: 'Get a Stripe Checkout URL so the user can add or update their credit card. REQUIRED after
    registration and whenever a 402 error occurs. The user must open the returned URL in their browser
    to add/update their card. Billing is pay-per-successful-request: no monthly fee, no minimums. You
    are only charged for successful API responses (2xx). Prices vary per API (see get_api_info). API calls
    are blocked until a valid credit card is on file.'
